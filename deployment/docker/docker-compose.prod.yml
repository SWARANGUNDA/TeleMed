name: telemed-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: telemed-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemed_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - telemed_prod_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - telemed-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemed-prod-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - telemed_prod_redis_data:/data
    networks:
      - telemed-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./web_platform/backend/Dockerfile
    container_name: telemed-prod-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./web_platform/backend:/app/web_platform/backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telemed_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telemed-prod-network

  celery-worker:
    build:
      context: .
      dockerfile: ./web_platform/backend/Dockerfile
    container_name: telemed-prod-celery-worker
    command: celery -A app.backend.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ./web_platform/backend:/app/web_platform/backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telemed_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - telemed-prod-network

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: telemed-prod-coturn
    restart: always
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
    environment:
      THIN_CLICKS: 1
    command:
      - turnserver
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-telemed.ai}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --user=${TURN_USER:-telemed}:${TURN_PASSWORD:-telemed_turn_secure_pass}
    networks:
      - telemed-prod-network

  nginx:
    image: nginx:1.25-alpine
    container_name: telemed-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web_platform/frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - telemed-prod-network

volumes:
  telemed_prod_postgres_data:
    name: telemed_prod_postgres_data
  telemed_prod_redis_data:
    name: telemed_prod_redis_data

networks:
  telemed-prod-network:
    name: telemed-prod-network
    driver: bridge
