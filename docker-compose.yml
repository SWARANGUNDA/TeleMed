name: telemed

services:
  postgres:
    image: postgres:17-alpine
    container_name: telemed-postgres
    restart: always
    environment:
      POSTGRES_DB: telemed_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - telemed_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemed-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - telemed_redis_data:/data
    networks:
      - telemed-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./web_platform/backend/Dockerfile
    container_name: telemed-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./web_platform/backend:/app/web_platform/backend
    env_file:
      - ./web_platform/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telemed_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telemed-network

  celery-worker:
    build:
      context: .
      dockerfile: ./web_platform/backend/Dockerfile
    container_name: telemed-celery-worker
    command: celery -A web_platform.backend.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ./web_platform/backend:/app/web_platform/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telemed_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - telemed-network

volumes:
  telemed_postgres_data:
    name: telemed_postgres_data
  telemed_redis_data:
    name: telemed_redis_data

networks:
  telemed-network:
    name: telemed-network
    driver: bridge
