name: TeleMed AI Platform — CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_platform/backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Syntax & Import Verification
        run: |
          python -c "import web_platform.backend.main; print('FastAPI Main App Import Verified')"
          python -c "import expert_models.v3_inference_engine; print('Expert Models V3 Engine Verified')"

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web_platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web_platform/frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: web_platform/frontend
        run: npm run build

  docker-validate:
    name: Docker Compose Infrastructure Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          mkdir -p web_platform/frontend/dist
          cp web_platform/backend/.env.example web_platform/backend/.env 2>/dev/null || touch web_platform/backend/.env
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.prod.yml config
