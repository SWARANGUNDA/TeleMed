name: telemed-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: telemed-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: telemed_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: StrongProductionPassword123!
    ports:
      - "5432:5432"
    volumes:
      - telemed_prod_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - telemed-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemed-prod-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - telemed_prod_redis_data:/data
    networks:
      - telemed-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./web_platform/backend/Dockerfile
    container_name: telemed-prod-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./web_platform/backend:/app/web_platform/backend
    environment:
      DATABASE_URL: postgresql://postgres:StrongProductionPassword123!@postgres:5432/telemed_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telemed-prod-network

  celery-worker:
    build:
      context: .
      dockerfile: ./web_platform/backend/Dockerfile
    container_name: telemed-prod-celery-worker
    command: celery -A web_platform.backend.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ./web_platform/backend:/app/web_platform/backend
    environment:
      DATABASE_URL: postgresql://postgres:StrongProductionPassword123!@postgres:5432/telemed_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - telemed-prod-network

  nginx:
    image: nginx:1.25-alpine
    container_name: telemed-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web_platform/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - telemed-prod-network

volumes:
  telemed_prod_postgres_data:
    name: telemed_prod_postgres_data
  telemed_prod_redis_data:
    name: telemed_prod_redis_data

networks:
  telemed-prod-network:
    name: telemed-prod-network
    driver: bridge
